  .q-stopbtn { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 100001; display: flex; align-items: center; gap: 6px;
    font: 700 15px system-ui, "Roboto", sans-serif; color: #fff; background: rgba(40,20,28,.72); border: 1.5px solid rgba(255,255,255,.35);
    border-radius: 999px; padding: 9px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .q-stopbtn:active { transform: scale(.94); }

    animation: tapstar .9s cubic-bezier(.2,.8,.3,1) both; will-change: transform, opacity; }

  .q-glowwin { width: 60px; height: 70px; margin: -35px 0 0 -30px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,216,120,.62), rgba(255,190,90,0) 70%); animation: qglow 3.4s ease-in-out infinite alternate; }

  .q-fly { position: absolute; left: 0; top: 70px; width: 176px; height: 64px; animation: qfly 24s linear infinite; }

  @keyframes qfly { 0% { transform: translate(-230px, 60px) rotate(-6deg); } 45% { transform: translate(1120px, -40px) rotate(-6deg); } 100% { transform: translate(1120px, -40px) rotate(-6deg); } }
  @keyframes qbob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  .q-alive > svg { animation: qbreath 3.2s ease-in-out infinite; transform-origin: 50% 100%; }

  .q-zone.show { opacity: 1; animation: qglow .9s ease-in-out infinite alternate; }
  .q-gift.dragging { transition: none; cursor: grabbing; }

  /* свечи, выключатель и погашенный свет */

  .q-candle { position: absolute; width: 24px; }

  /* пустые страницы */
  .empty { display: flex; height: 100%; align-items: center; justify-content: center;
           flex-direction: column; text-align: center; color: #aaa; }
  .empty h1 { font-size: 28px; color: #2b2b2b; margin-bottom: 8px; }

  /* ===== Страница 1: книга ===== */
  #page-1 { background: #0d0805; overflow: hidden; }
  #snow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
  .land {
    position: absolute; left: 50%; top: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    perspective: 2400px;
  }
  .book {
    --p: 200px; --h: calc(var(--p) * 1.1);
    position: relative; width: calc(var(--p) * 2); height: var(--h);
    transform: translateX(calc(var(--p) / -2));
    transition: transform 1.2s cubic-bezier(.6,.05,.3,1);
    transform-style: preserve-3d; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .book.open { transform: translateX(0); cursor: default; }

  /* разворот */
  .spread { position: absolute; inset: 0; display: flex; }
  .leaf {
    width: var(--p); height: 100%; background: #f1e4c6; position: relative;
    padding: calc(var(--p) * .09); display: flex; flex-direction: column;
    font-family: "Cormorant Garamond", Georgia, serif; color: #3a2a1f;
  }
  .leaf.left {
    border-radius: 6px 0 0 6px; opacity: 0; transition: opacity .5s;
    background: url(assets/noise.png) 0 0 / 240px 240px, url(assets/paper-l.jpg) center / 100% 100% no-repeat #f1e4c6;
    box-shadow: -1px 1px 0 #dcc8a0, -2px 2px 0 #bfa477, -3px 3px 0 #d8c296, -4px 4px 0 #b99d6f, -5px 5px 0 #d1b98c, -6px 6px 0 #a88c5f, -10px 16px 30px rgba(0,0,0,.55);
  }
  .book.open .leaf.left { opacity: 1; transition: opacity .2s 1s; }
  .leaf.right {
    border-radius: 0 6px 6px 0;
    background: url(assets/noise.png) 50px 80px / 240px 240px, url(assets/paper-r.jpg) center / 100% 100% no-repeat #f1e4c6;
    box-shadow: 1px 1px 0 #dcc8a0, 2px 2px 0 #bfa477, 3px 3px 0 #d8c296, 4px 4px 0 #b99d6f, 5px 5px 0 #d1b98c, 6px 6px 0 #a88c5f, 10px 16px 30px rgba(0,0,0,.55);
  }
  .page-content { flex: 1; display: flex; flex-direction: column; transition: opacity .35s; }
  .page-content.fade { opacity: 0; }
  .slot {
    flex: 1; border: 2px dashed #cdb89a; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: #a68d6a; font-style: italic; font-size: calc(var(--p) * .075); padding: 8px;
  }
  .story {
    flex: 1; font-size: calc(var(--p) * .075); line-height: 1.45;
    color: #a68d6a; font-style: italic;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .slot.art { border: none; padding: 0; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .slot { min-height: 0; position: relative; }
  .slot.art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .story.real {
    color: #3a2a1f; font-style: normal; text-align: left; align-items: center;
    font-size: calc(var(--p) * .085);
  }
  .story.real p:first-child::first-letter { font-size: 2.2em; color: #8e1b2c; font-weight: 700; float: left; line-height: .9; margin-right: 4px; }
  .page-num { position: absolute; bottom: calc(var(--p) * .025); font-size: calc(var(--p) * .055); color: #b9a385; }
  .leaf.left .page-num { left: calc(var(--p) * .035); }
  .leaf.right .page-num { right: calc(var(--p) * .035); }

  /* обложка с переплётом */
  .cover {
    position: absolute; left: var(--p); top: 0; width: var(--p); height: 100%;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 1.4s cubic-bezier(.6,.05,.3,1), opacity .3s;
    z-index: 3;
  }
  .book.open .cover { transform: rotateY(-180deg); }
  .book.opened .cover { visibility: hidden; pointer-events: none; }
  /* левая страница под обложкой сначала чистая (как оборот обложки), рисунок на ней мягко проявляется */
  .spread > .leaf.left > .page-content, .spread > .leaf.left::after { opacity: 0; transition: opacity .45s ease; }
  .book.opened .spread > .leaf.left > .page-content, .book.opened .spread > .leaf.left::after { opacity: 1; }
  .book.closing .spread > .leaf.left > .page-content, .book.closing .spread > .leaf.left::after { opacity: 0; }
  .cover-front, .cover-back {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .cover-front {
    border-radius: 3px 8px 8px 3px;
    background:
      linear-gradient(to bottom, rgba(255,236,185,.42), transparent calc(var(--p) * .035)),
      radial-gradient(ellipse 85% 70% at 50% -8%, rgba(255,238,195,.3), rgba(255,224,165,.1) 50%, transparent 85%),
      radial-gradient(circle at 100% 0%, rgba(150,110,70,.35), transparent 9%),
      radial-gradient(circle at 100% 100%, rgba(150,110,70,.35), transparent 9%),
      radial-gradient(ellipse at 30% 20%, rgba(255,230,190,.06), transparent 55%),
      radial-gradient(ellipse at 65% 75%, rgba(0,0,0,.45), transparent 60%),
      var(--scratch), var(--leather),
      linear-gradient(135deg, #24090a 0%, #160505 50%, #080202 100%);
    box-shadow: inset 0 0 calc(var(--p) * .06) rgba(0,0,0,.8), inset 0 0 2px rgba(160,120,80,.4),
      1px 1px 0 #dcc8a0, 2px 2px 0 #bfa477, 3px 3px 0 #d8c296, 4px 4px 0 #b99d6f, 5px 5px 0 #d1b98c, 6px 6px 0 #a88c5f, 14px 22px 44px rgba(0,0,0,.8);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(var(--p) * .12) calc(var(--p) * .1) calc(var(--p) * .12) calc(var(--p) * .16);
    font-family: "Cormorant Garamond", Georgia, serif; color: #a68649; text-align: center;
    text-shadow: 0 -1px 0 rgba(0,0,0,.9), 0 1px 0 rgba(255,220,150,.15);
  }
  /* корешок / переплёт */
  .cover-front::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p) * .09);
    border-radius: 3px 0 0 3px;
    background:
      linear-gradient(to bottom, rgba(255,236,185,.3), transparent 20%),
      repeating-linear-gradient(to bottom, transparent 0 17%, rgba(0,0,0,.6) 17% 17.5%, rgba(140,105,60,.45) 17.5% 18.5%, rgba(0,0,0,.6) 18.5% 19%, transparent 19% 21%, rgba(140,105,60,.4) 21% 22%, transparent 22%),
      linear-gradient(to bottom, rgba(140,100,60,.25), transparent 6%, transparent 94%, rgba(140,100,60,.25)),
      var(--leather),
      linear-gradient(to right, #040101, #1c0607 40%, #130404 70%, #030101);
    box-shadow: inset -4px 0 10px rgba(0,0,0,.9), inset 2px 0 3px rgba(220,120,130,.2);
  }
  /* золотая рамка */
  .cover-front::after {
    content: ""; position: absolute;
    left: calc(var(--p) * .14); right: calc(var(--p) * .06);
    top: calc(var(--p) * .06); bottom: calc(var(--p) * .06);
    border: 1.5px solid rgba(241,213,138,.7); border-radius: 4px;
    outline: 1px solid rgba(241,213,138,.35); outline-offset: -6px;
    pointer-events: none;
  }
  .cover-orn { font-size: calc(var(--p) * .1); opacity: .9; letter-spacing: .3em; }
  /* тиснёные узоры на обложке: ромбическая сетка, уголки с завитками, виньетки */
  .cover-pattern {
    position: absolute; pointer-events: none;
    left: calc(var(--p) * .165); right: calc(var(--p) * .085); top: calc(var(--p) * .085); bottom: calc(var(--p) * .085);
    background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(20,0,6,.45) 100%), var(--emb) center / calc(var(--p) * .15) calc(var(--p) * .15);
    border: 1px solid rgba(214,178,100,.35); border-radius: 2px;
    box-shadow: inset 1px 1px 0 rgba(0,0,0,.6), inset -1px -1px 0 rgba(255,170,170,.12);
  }
  /* под заголовком — гладкое поле кожи, чтобы надпись читалась */
  .cover-front .cover-title::before { content: ""; position: absolute; z-index: -1; left: -14%; right: -14%; top: -30%; bottom: -30%; border-radius: 50%;
    background: radial-gradient(ellipse, #1a0606 45%, rgba(26,6,6,.85) 60%, transparent 72%); }
  .cover-corner { position: absolute; width: calc(var(--p) * .2); height: calc(var(--p) * .2); color: #cdaa5f; pointer-events: none; }
  .cover-corner.tl { left: calc(var(--p) * .16); top: calc(var(--p) * .08); }
  .cover-corner.tr { right: calc(var(--p) * .08); top: calc(var(--p) * .08); transform: scaleX(-1); }
  .cover-corner.bl { left: calc(var(--p) * .16); bottom: calc(var(--p) * .08); transform: scaleY(-1); }
  .cover-corner.br { right: calc(var(--p) * .08); bottom: calc(var(--p) * .08); transform: scale(-1); }
  .cover-flourish { position: relative; width: calc(var(--p) * .5); height: calc(var(--p) * .1); color: #d2b068; flex: none; }
  .cover-front .cover-title { position: relative; font-size: calc(var(--p) * .118); margin: calc(var(--p) * .035) 0; color: #d0ad62;
    text-shadow: 0 -1px 0 rgba(0,0,0,.9), 0 1px 0 rgba(255,225,160,.18), 0 0 calc(var(--p) * .05) rgba(255,205,120,.28); }
  .cover-title {
    font-family: "Monomakh", "Cormorant Garamond", serif; font-weight: 400 !important;
    font-weight: 700; font-size: calc(var(--p) * .13); line-height: 1.1; margin: calc(var(--p) * .06) 0;
    text-shadow: 0 1px 0 rgba(0,0,0,.4);
  }
  .cover-back {
    transform: rotateY(180deg); border-radius: 8px 3px 3px 8px;
    background: url(assets/noise.png) 0 0 / 240px 240px, url(assets/paper-l.jpg) center / 100% 100% no-repeat #f1e4c6;
  }


  /* оживлённая иллюстрация */
  .slot.art svg * { transform-box: fill-box; }
  .slot.art .fly { animation: fly 4s ease-in-out infinite; transform-box: view-box; }
  @keyframes fly { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(4px,-7px) rotate(-1.2deg); } }
  .slot.art .bob { animation: bob .9s ease-in-out infinite; }
  .slot.art .b2 { animation-delay: -.3s; } .slot.art .b3 { animation-delay: -.6s; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .slot.art .nose { animation: nose 1.4s ease-in-out infinite; transform-origin: center; }
  @keyframes nose { 50% { fill: #ff8080; transform: scale(1.35); } }
  .slot.art .stars circle { animation: tw 2.4s ease-in-out infinite; }
  .slot.art .stars circle:nth-child(3n) { animation-delay: -.8s; }
  .slot.art .stars circle:nth-child(3n+1) { animation-delay: -1.6s; animation-duration: 3s; }
  @keyframes tw { 50% { opacity: .15; } }
  .slot.art .glow { animation: glow 4s ease-in-out infinite; transform-origin: center; }
  @keyframes glow { 50% { opacity: .55; transform: scale(1.12); } }
  .slot.art .sparks circle { animation: spark 1.2s ease-out infinite; }
  .slot.art .sparks circle:nth-child(2n) { animation-delay: -.6s; }
  @keyframes spark { 0% { opacity: 1; transform: translate(0,0); } 100% { opacity: 0; transform: translate(-10px,8px); } }
  .slot.art .win { animation: win 3s ease-in-out infinite; } .slot.art .w2 { animation-delay: -1.3s; }
  @keyframes win { 0%,100% { fill: #ffd66b; } 50% { fill: #ffb347; } }
  .slot.art .sf { animation: sf 7s linear infinite; }
  @keyframes sf { from { transform: translate(0,0); } to { transform: translate(-14px,360px); } }

  /* текст появляется по словам */
  .story .w { opacity: 0; display: inline; animation: word .5s ease-out forwards; }
  @keyframes word { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: blur(0); } }
  .story.real p.reveal::first-letter { }
  .face .shine { position: absolute; inset: 0; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,.9), rgba(255,255,255,0)); opacity: 0; pointer-events: none; will-change: opacity; }

  /* готический стиль: фото-иллюстрация, текст и номера */
  .slot.photo { border: none; padding: 0; }
  .slot.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .story.real {
    font-family: "Monomakh", "Cormorant Garamond", serif; color: #2a1d14;
    font-size: calc(var(--p) * .045); line-height: 1.38; text-align: left;
    align-items: center; padding: 0;
  }
  .story.real p:first-child::first-letter {
    font-family: "Monomakh", serif; font-size: 2.6em; color: #7a1222; line-height: .85;
    margin: .05em .08em 0 0; text-shadow: 1px 1px 0 rgba(0,0,0,.15);
  }
  .page-num { font-family: "Grenze Gotisch", serif !important; font-weight: 600; color: #6b4a2e !important;
              font-size: calc(var(--p) * .07) !important; }

  /* старая бумага — готовые картинки (assets/paper-*.jpg): пятна, разводы и тёмные края уже в них,
     поэтому телефону не нужно вычислять текстуры и смешивать слои */
  .leaf::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; display: none;
    background: url(assets/vignette.png) center / 100% 100% no-repeat;
  }
  .leaf.photo::after { display: block; }       /* поверх иллюстрации — только затемнённые края */

  /* иллюстрация выше и крупнее */
  .slot.photo { position: absolute; inset: 0; margin: 0; border-radius: inherit; overflow: hidden; }
  .slot.photo img { object-fit: cover; object-position: center; }

  .leaf .slot.photo ~ .page-num { color: #f1e4c6 !important; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 1; }
  .story .txt p + p { margin-top: .7em; }
  /* текст красивее */
  .story.real p:last-child::after {
    content: "❦"; display: block; text-align: center; color: #7a1222;
    font-size: 1em; margin-top: .3em; opacity: .85;
  }
  .story.real p:first-child::first-letter { padding: .02em .06em; border: 1px solid rgba(122,18,34,.35); border-radius: 2px;
                                background: rgba(122,18,34,.06); margin-right: .12em; }

  /* кожа, царапины */
  :root {
    --leather: url(assets/leather.png);
    --emb: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><g fill='none' stroke='rgba(0,0,0,.62)' stroke-width='2.4' transform='translate(1.1 1.3)'><path d='M28 0L56 28L28 56L0 28Z'/><path d='M28 14c5 0 7 6 0 14c-7-8-5-14 0-14zM28 42c5 0 7-6 0-14c-7 8-5 14 0 14zM14 28c0-5 6-7 14 0c-8 7-14 5-14 0zM42 28c0-5-6-7-14 0c8 7 14 5 14 0z'/><circle cx='28' cy='28' r='2.2'/><circle cx='0' cy='0' r='3'/><circle cx='56' cy='0' r='3'/><circle cx='0' cy='56' r='3'/><circle cx='56' cy='56' r='3'/></g><g fill='none' stroke='rgba(230,170,140,.14)' stroke-width='1.5' transform='translate(-.7 -.8)'><path d='M28 0L56 28L28 56L0 28Z'/><path d='M28 14c5 0 7 6 0 14c-7-8-5-14 0-14zM28 42c5 0 7-6 0-14c-7 8-5 14 0 14zM14 28c0-5 6-7 14 0c-8 7-14 5-14 0zM42 28c0-5-6-7-14 0c8 7 14 5 14 0z'/><circle cx='28' cy='28' r='2.2'/><circle cx='0' cy='0' r='3'/><circle cx='56' cy='0' r='3'/><circle cx='0' cy='56' r='3'/><circle cx='56' cy='56' r='3'/></g><g fill='rgba(95,32,24,.2)' stroke='rgba(40,8,6,.95)' stroke-width='1.3'><path d='M28 0L56 28L28 56L0 28Z'/><path d='M28 14c5 0 7 6 0 14c-7-8-5-14 0-14zM28 42c5 0 7-6 0-14c-7 8-5 14 0 14zM14 28c0-5 6-7 14 0c-8 7-14 5-14 0zM42 28c0-5-6-7-14 0c8 7 14 5 14 0z'/><circle cx='28' cy='28' r='2.2'/><circle cx='0' cy='0' r='3'/><circle cx='56' cy='0' r='3'/><circle cx='0' cy='56' r='3'/><circle cx='56' cy='56' r='3'/></g></svg>");
    --scratch: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='500'><g stroke='rgba(180,140,100,.18)' stroke-width='.8' fill='none'><path d='M40 60 l70 22'/><path d='M300 120 l-50 40'/><path d='M120 380 q40 -10 90 8'/><path d='M260 430 l60 -18'/><path d='M60 250 l30 50'/><path d='M330 300 l-20 60'/></g></svg>");
  }
  /* номера страниц убраны */
  .page-num { display: none !important; }

  /* доски переплёта под раскрытыми страницами */
  .boards {
    position: absolute; z-index: -1; opacity: 0; transition: opacity .5s;
    left: calc(var(--p) * -.035); right: calc(var(--p) * -.035);
    top: calc(var(--p) * -.03); bottom: calc(var(--p) * -.04);
    border-radius: 8px;
    background:
      linear-gradient(to right, transparent 47%, rgba(0,0,0,.6) 49.5%, #050201 50%, rgba(0,0,0,.6) 50.5%, transparent 53%),
      radial-gradient(circle at 0 0, rgba(150,110,70,.3), transparent 6%),
      radial-gradient(circle at 100% 100%, rgba(150,110,70,.3), transparent 6%),
      var(--emb) 0 0 / calc(var(--p) * .16) calc(var(--p) * .16),
      var(--leather),
      linear-gradient(160deg, #200808, #130404 60%, #070101);
    box-shadow: 0 30px 60px rgba(0,0,0,.75), 0 8px 18px rgba(0,0,0,.6), inset 0 0 10px rgba(0,0,0,.8);
  }
  .book.opened .boards { opacity: 1; }

  /* живые тени разворота: корешок, изгиб страниц, свет */
  .spread::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background:
      linear-gradient(to right,
        rgba(60,35,15,.28) 0%, transparent 6%, transparent 38%,
        rgba(60,35,15,.18) 44%, rgba(30,15,5,.55) 49.3%, rgba(0,0,0,.7) 50%, rgba(30,15,5,.55) 50.7%,
        rgba(60,35,15,.18) 56%, transparent 62%, transparent 94%, rgba(60,35,15,.28) 100%),
      linear-gradient(to right, transparent 20%, rgba(255,245,215,.18) 30%, transparent 42%,
        transparent 58%, rgba(255,245,215,.14) 70%, transparent 82%);
    opacity: 0; transition: opacity .5s;
  }
  .spread::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background:
      linear-gradient(to bottom, rgba(255,236,185,.3), transparent calc(var(--p) * .035)),
      radial-gradient(ellipse 85% 70% at 50% -8%, rgba(255,238,195,.32), rgba(255,224,165,.13) 50%, transparent 85%),
      radial-gradient(ellipse at 22% 10%, rgba(255,235,190,.14), transparent 55%);
    opacity: 0; transition: opacity .5s;
  }
  .book.opened .spread::after, .book.opened .spread::before { opacity: 1; }

  /* ===== подиум, свет и камера ===== */
  .scene { position: relative; transform-origin: 50% 0; will-change: transform; transform-style: preserve-3d; }
  .podium {
    position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: -2;
  }
  .podium > div { position: relative; }
  .pd-top {
    width: calc(var(--p) * 1.7); height: calc(var(--p) * .09); border-radius: 4px;
    background: var(--leather), linear-gradient(to bottom, #6b4a2c, #3a2414 40%, #1e1109);
    box-shadow: inset 0 2px 0 rgba(230,190,120,.45), inset 0 -2px 0 rgba(0,0,0,.6), 0 10px 18px rgba(0,0,0,.6);
  }
  .pd-top::after { content: ""; position: absolute; left: 4%; right: 4%; bottom: 22%; height: 2px;
                   background: linear-gradient(to right, transparent, #b8924f, #f0cf86, #b8924f, transparent); opacity: .7; }
  .pd-neck { width: calc(var(--p) * 1.35); height: calc(var(--p) * .07);
             background: linear-gradient(to right, #120a05, #3b2615 30%, #5a3c22 45%, #2a1a0d 70%, #0d0703); }
  .pd-col {
    width: calc(var(--p) * 1.05); height: calc(var(--p) * 1.0);
    background:
      repeating-linear-gradient(to right, rgba(0,0,0,.35) 0 2px, transparent 2px 9%, rgba(255,220,170,.06) 9% 10%, transparent 10% 12.5%),
      linear-gradient(to right, #0b0603, #2e1d10 25%, #573a20 42%, #3a2614 60%, #160d06 85%, #060302);
    box-shadow: inset 0 10px 14px rgba(0,0,0,.6);
  }
  .pd-plinth { width: calc(var(--p) * 1.3); height: calc(var(--p) * .08);
               background: linear-gradient(to right, #0d0703, #3e2817 35%, #5d3f24 48%, #2a1a0d 70%, #080402);
               box-shadow: inset 0 2px 0 rgba(220,180,110,.3); }
  .pd-base { width: calc(var(--p) * 1.6); height: calc(var(--p) * .13); border-radius: 3px;
             background: linear-gradient(to right, #0a0503, #34210f 35%, #4f351d 48%, #22150a 70%, #050201);
             box-shadow: inset 0 2px 0 rgba(220,180,110,.35), 0 20px 40px rgba(0,0,0,.9); }
  .pd-warm { position: absolute; inset: 0; background: linear-gradient(to right, rgba(255,140,50,.22), transparent 45%);
             animation: fireLight 1.9s steps(1) infinite, fire 1.2s ease-in-out infinite alternate; }
  .floor {
    position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: -3;
    top: calc(100% + var(--p) * 1.2); width: calc(var(--p) * 14); height: calc(var(--p) * 4);
    background:
      radial-gradient(ellipse 12% 6% at 50% 6%, rgba(0,0,0,.85), transparent 100%),
      radial-gradient(ellipse 30% 20% at 50% 5%, rgba(255,220,160,.16), transparent 100%),
      linear-gradient(to bottom, #120d14, #07050a 60%, #030205);
  }
  /* свет сверху над книгой: готовые картинки луча и сияния (маски и режимы смешивания тяжёлые для телефона) */
  .lamp { position: absolute; left: 50%; top: 0; width: 0; height: 0; pointer-events: none; z-index: -1; }
  .lamp img, .lamp-front { position: absolute; display: block; max-width: none; pointer-events: none; }
  .lamp-beam {
    left: calc(var(--p) * -1.45); width: calc(var(--p) * 2.9);
    top: calc(var(--p) * -3.4); height: calc(var(--p) * 3.6 + var(--h));
    animation: flicker 6s ease-in-out infinite;
  }
  .lamp-halo {
    left: calc(var(--p) * -1.35); width: calc(var(--p) * 2.7);
    top: calc(var(--p) * -.75); height: calc(var(--p) * 1.5);
    animation: flicker 6s ease-in-out infinite;
  }
  .motes { position: absolute; left: 0; top: 0; font-size: var(--p); }
  .motes i {
    position: absolute; width: calc(var(--p) * .012); height: calc(var(--p) * .012); min-width: 2px; min-height: 2px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,225,1), rgba(255,225,160,.5) 60%, transparent 75%);
    animation: mote 12s ease-in-out infinite;
  }
  @keyframes mote {
    0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: .9; }
    50% { transform: translate(calc(var(--p) * .05), calc(var(--p) * -.12)); opacity: .55; }
    80% { opacity: .9; } 100% { transform: translate(calc(var(--p) * -.03), calc(var(--p) * -.26)); opacity: 0; }
  }
  /* лучи света, проходящие перед обложкой */
  .lamp-front {
    left: 50%; top: calc(var(--p) * -2.6); width: calc(var(--p) * 3); height: calc(var(--p) * 2.9 + var(--h));
    margin-left: calc(var(--p) * -1.5); z-index: 7; transform: translateZ(2px);
    opacity: .46; transition: opacity 1.2s;
  }
  @keyframes flickerF { 0%,100% { opacity: .5; } 45% { opacity: .42; } 50% { opacity: .48; } 70% { opacity: .44; } }
  .land.opening .lamp-front { opacity: 0; }
  /* книга раскрыта — луча и пылинок за ней не видно, выключаем их */
  .land.opened .lamp-front, .land.opened .lamp-beam, .land.opened .motes { display: none; }
  .land.opened .lamp-halo { animation: none; }
  /* облегчённый режим: включается сам, если телефон не успевает рисовать плавно */
  .land.lite .twinkles, .land.lite .bokeh, .land.lite .motes, .land.lite .star-glow, .land.lite .flames i, .land.lite .flames b.r { display: none; }
  .land.lite .fire-flicker, .land.lite .pd-warm { animation: none; }
  .land.lite .fire-glow, .land.lite .fire-floor, .land.lite .lamp-beam, .land.lite .lamp-halo, .land.lite .lamp-front { animation: none; }
  .pd-top::before { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(ellipse 46% 130% at 50% 0%, rgba(255,228,170,.5), transparent 72%); }
  .spot {
    position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; z-index: -1;
    bottom: calc(var(--p) * -1.3); width: calc(var(--p) * 4.2); height: calc(var(--h) + var(--p) * 6);
    background: linear-gradient(to bottom, rgba(255,232,180,.0), rgba(255,226,170,.08) 60%, rgba(255,215,150,.14));
    clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); filter: blur(10px);
    animation: flicker 6s ease-in-out infinite;
  }
  @keyframes flicker { 0%,100% { opacity: 1; } 45% { opacity: .85; } 50% { opacity: .95; } 70% { opacity: .88; } }

  /* киношные полосы сверху и снизу, уезжают после наезда */
  .bars { position: absolute; left: 0; right: 0; height: 11%; background: #000; z-index: 30; pointer-events: none;
          transition: transform 1.2s ease; }
  .bars.top { top: 0; } .bars.bottom { bottom: 0; }
  .land.cinema-done .bars.top { transform: translateY(-100%); }
  .land.cinema-done .bars.bottom { transform: translateY(100%); }

  .voice-btn {
    position: absolute; top: 12px; right: 14px; z-index: 40; width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(201,168,94,.55); background: rgba(20,10,5,.65); color: #e8d3a0;
    font-size: 19px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .6s;
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .land.cinema-done .voice-btn { opacity: 1; pointer-events: auto; }
  .voice-btn.off { opacity: .55 !important; }

  /* старинная живая ёлка у подиума */
  .xmas-tree {
    position: absolute; pointer-events: none; z-index: -2;
    left: calc(50% + var(--p) * .95); top: calc(100% + var(--p) * 1.37 - var(--p) * 2.45);
    width: calc(var(--p) * 1.67); height: calc(var(--p) * 2.45);
  }
  .xmas-tree svg { width: 100%; height: 100%; overflow: visible; }
  .xmas-tree svg * { transform-box: fill-box; }
  .tree-sway { transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-.6deg); } 50% { transform: rotate(.6deg); } }
  .xmas-tree .flame { transform-origin: 50% 100%; animation: flame .35s ease-in-out infinite alternate; }
  .flames b { position: absolute; bottom: -4%; border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%; transform-origin: 50% 90%;
    animation: tongue .9s ease-in-out infinite alternate; }
  .flames b.r { background: radial-gradient(ellipse 50% 60% at 50% 70%, rgba(255,130,45,.55), rgba(220,70,20,.28) 50%, transparent 75%); }
  .flames b.c { background: radial-gradient(ellipse 45% 55% at 50% 72%, rgba(255,250,225,.8), rgba(255,220,130,.5) 40%, transparent 72%); }
  @keyframes tongue {
    0% { transform: scale(.92, .78) skewX(-8deg) translateY(4%); opacity: .55; }
    35% { transform: scale(1.03, 1.08) skewX(5deg); opacity: 1; }
    70% { transform: scale(.88, 1.02) skewX(-3deg) translateY(-3%); opacity: .8; }
    100% { transform: scale(1.06, .9) skewX(9deg); opacity: .9; }
  }
  .fire-flicker { left: -6%; top: 20%; width: 72%; height: 80%; border-radius: 50%; z-index: 6; pointer-events: none;
    background: radial-gradient(ellipse at 34% 55%, rgba(255,150,60,.22), rgba(255,110,40,.08) 45%, transparent 70%);
    animation: fireLight 2.3s steps(1) infinite; }
  @keyframes fireLight { 0% { opacity: .7; } 9% { opacity: 1; } 17% { opacity: .62; } 26% { opacity: .9; } 38% { opacity: .75; } 47% { opacity: 1; }
                         58% { opacity: .66; } 66% { opacity: .95; } 77% { opacity: .72; } 88% { opacity: .98; } }
  @keyframes flame { from { transform: scale(1, 1) skewX(-3deg); opacity: .9; } to { transform: scale(.85, 1.15) skewX(4deg); opacity: 1; } }
  .xmas-tree .cglow { transform-origin: center; animation: cglow 1.6s ease-in-out infinite; }
  @keyframes cglow { 50% { opacity: .55; transform: scale(.85); } }
  .xmas-tree .ornament { transform-origin: 50% 0; animation: swing 3.5s ease-in-out infinite; }
  @keyframes swing { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .xmas-tree .glint { animation: glint 3s ease-in-out infinite; }
  @keyframes glint { 0%,100% { opacity: .85; } 50% { opacity: .25; } }
  .xmas-tree .tstar { transform-origin: center; animation: star 4s ease-in-out infinite; }
  @keyframes star { 50% { opacity: .8; transform: scale(1.06); } }
  .xmas-tree .tg-halo { animation: cglow 4s ease-in-out infinite; transform-origin: center; }

  /* заставка для запуска со звуком */
  .gate {
    position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; cursor: pointer;
    background: radial-gradient(ellipse at 50% 45%, rgba(40,22,12,.92), rgba(5,3,2,.97) 70%);
    font-family: "Monomakh", serif; color: #c9a85e; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity 1s;
  }
  .gate.show { opacity: 1; pointer-events: auto; }
  .gate.hide { opacity: 0 !important; pointer-events: none !important; }
  .gate-orn { font-size: 22px; letter-spacing: .4em; opacity: .8; }
  .gate-title { font-size: clamp(26px, 6vmin, 54px); text-shadow: 0 2px 12px rgba(0,0,0,.8); padding: 0 20px; }
  .gate-tap { font-size: clamp(16px, 3vmin, 24px); color: #e8d3a0; animation: pulse 2s ease-in-out infinite; margin-top: 10px; }

  /* подсказка, если телефон придержал звук */
  .sound-hint {
    position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); z-index: 49;
    padding: .5em 1.2em; border-radius: 999px; white-space: nowrap;
    background: rgba(20,11,6,.84); border: 1px solid rgba(201,168,94,.45);
    font-family: "Monomakh", serif; font-size: clamp(13px, 2.6vmin, 20px); color: #e8d3a0;
    box-shadow: 0 4px 18px rgba(0,0,0,.6);
    opacity: 0; pointer-events: none; transition: opacity .5s;
  }
  .sound-hint.show { opacity: 1; animation: pulse 2s ease-in-out infinite; }

  /* уютная комната с камином на фоне: чёткая и заранее размытая картинки плавно сменяют друг друга,
     поэтому телефону не нужно размывать фон на лету (это было самым тяжёлым) */
  .room {
    position: absolute; z-index: -5; pointer-events: none; transform-origin: 50% 62%;
    transition: transform 14s cubic-bezier(.5,0,.15,1);
    will-change: transform; backface-visibility: hidden;
  }
  .room.near { transform: scale(1.18); }
  .room img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .room .room-soft { opacity: 0; transition: opacity 14s ease; }
  .room.near .room-soft { opacity: 1; }
  .room > div { position: absolute; }
  .fire-glow {
    left: 8%; top: 46%; width: 34%; height: 26%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,216,134,.36), rgba(255,150,50,.14) 45%, transparent 70%);
    animation: fire 1.3s ease-in-out infinite alternate, fireLight 2.9s steps(1) infinite;
  }
  .fire-floor {
    left: 2%; top: 62%; width: 50%; height: 18%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,156,66,.22), transparent 70%);
    animation: fire 1.7s ease-in-out infinite alternate-reverse;
  }
  @keyframes fire {
    0% { opacity: .65; transform: scale(1); } 30% { opacity: .95; transform: scale(1.04, .97); }
    55% { opacity: .75; } 80% { opacity: 1; transform: scale(.97, 1.03); } 100% { opacity: .7; }
  }
  .star-glow {
    left: 72%; top: 4%; width: 17%; height: 14%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,240,190,.6), transparent 65%);
    animation: cglow 3s ease-in-out infinite;
  }
  .twinkles { inset: 0; z-index: 6; }
  .fire-glow, .fire-floor, .star-glow, .bokeh { z-index: 6; }
  /* живой огонь: языки пламени колышутся, вверх летят искры */
  .flames { left: 16.5%; top: 51%; width: 15%; height: 15.5%; z-index: 6; }
  .flames span {
    position: absolute; bottom: -6%; border-radius: 50%; transform-origin: 50% 78%;
    background: radial-gradient(ellipse 46% 58% at 50% 64%, rgba(255,246,200,.9), rgba(255,200,84,.7) 36%, rgba(255,124,32,.3) 68%, transparent 100%);
    animation: flame .7s ease-in-out infinite alternate;
  }
  .flames b { position: absolute; bottom: -4%; border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%; transform-origin: 50% 90%;
    animation: tongue .9s ease-in-out infinite alternate; }
  .flames b.r { background: radial-gradient(ellipse 50% 60% at 50% 70%, rgba(255,130,45,.55), rgba(220,70,20,.28) 50%, transparent 75%); }
  .flames b.c { background: radial-gradient(ellipse 45% 55% at 50% 72%, rgba(255,250,225,.8), rgba(255,220,130,.5) 40%, transparent 72%); }
  @keyframes tongue {
    0% { transform: scale(.92, .78) skewX(-8deg) translateY(4%); opacity: .55; }
    35% { transform: scale(1.03, 1.08) skewX(5deg); opacity: 1; }
    70% { transform: scale(.88, 1.02) skewX(-3deg) translateY(-3%); opacity: .8; }
    100% { transform: scale(1.06, .9) skewX(9deg); opacity: .9; }
  }
  .fire-flicker { left: -6%; top: 20%; width: 72%; height: 80%; border-radius: 50%; z-index: 6; pointer-events: none;
    background: radial-gradient(ellipse at 34% 55%, rgba(255,150,60,.22), rgba(255,110,40,.08) 45%, transparent 70%);
    animation: fireLight 2.3s steps(1) infinite; }
  @keyframes fireLight { 0% { opacity: .7; } 9% { opacity: 1; } 17% { opacity: .62; } 26% { opacity: .9; } 38% { opacity: .75; } 47% { opacity: 1; }
                         58% { opacity: .66; } 66% { opacity: .95; } 77% { opacity: .72; } 88% { opacity: .98; } }
  @keyframes flame {
    0% { transform: scale(1, .82) skewX(-5deg); opacity: .65; }
    45% { transform: scale(.9, 1.12) skewX(4deg); opacity: .95; }
    100% { transform: scale(1.06, .95) skewX(-2deg); opacity: .78; }
  }
  .flames i {
    position: absolute; bottom: 55%; width: 3.5%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, #fff3c0, rgba(255,170,60,.8) 50%, transparent 72%);
    opacity: 0; animation: spark 3s ease-out infinite;
  }
  @keyframes spark {
    0% { transform: translate(0, 0) scale(1); opacity: 0; } 10% { opacity: 1; }
    100% { transform: translate(var(--dx), -620%) scale(.3); opacity: 0; }
  }
  .twinkles i {
    position: absolute; width: .9%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,250,220,1), rgba(255,210,120,.5) 40%, transparent 70%);

  /* ---------- навигация по страницам сайта ---------- */

  function show() {

      if (sec.id === id) { sec.classList.remove("gone"); void sec.offsetWidth; sec.classList.add("active"); }
      else if (sec.classList.contains("active")) {            // уходящая страница растворяется и только потом выключается

        sec._gone = setTimeout(() => sec.classList.add("gone"), 950);
      } else sec.classList.add("gone");

  /* ---------- горизонтальное положение ---------- */

  let P = 200, PORTRAIT = false, LH = 400, HH = 300, cameraDone = false;
  function layout() {

    land.style.width = lw + "px";
    land.style.height = lh + "px";
    land.style.transform = "translate(-50%, -50%)" + (portrait ? " rotate(90deg)" : "");

    land.style.paddingTop = "0px";
    land.style.paddingBottom = (shift * 2) + "px";
    const h = lh - 16 - shift * 2;           // книга вытянута почти на всю высоту
    const p = Math.min(lw * 0.94 / 2, h / 0.95);

    book.style.setProperty("--p", P + "px");

  /* ---------- звук: одна запись на всё — вступление, пауза, чтение первой страницы ---------- */

  const VOICES = [15.276, 56.928, 83.82];   // с этих секунд в общей записи начинается чтение каждой страницы

  let finished = false;                     // книга закрылась после рассказа
